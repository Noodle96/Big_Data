<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Flujo del job de Flink: de Kafka a las 5 salidas del laboratorio</title>
<desc>Diagrama mostrando cómo un evento de Kafka pasa por parseo y enriquecimiento secuencial, y luego se bifurca en tres ramas independientes: filtrado, conteo por tipo y agrupamiento por producto.</desc>
<rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>

<text x="500" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">Flujo del job Flink: de Kafka a las 5 salidas</text>

<!-- Kafka source -->
<rect x="370" y="55" width="260" height="55" rx="10" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="2"/>
<text x="500" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Kafka: topic ecommerce-events</text>

<line x1="500" y1="110" x2="500" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- JsonToEventMapper -->
<rect x="330" y="145" width="340" height="60" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="500" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">map: JsonToEventMapper (2.1)</text>
<text x="500" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057">imprime [2.1 RECIBIDO]</text>

<line x1="500" y1="205" x2="500" y2="235" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- EnrichWithDateFieldsMapper -->
<rect x="300" y="240" width="400" height="60" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="500" y="265" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">map: EnrichWithDateFieldsMapper (2.3)</text>
<text x="500" y="285" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057">+hora/dia/mes/finDeSemana — imprime [2.3 TRANSFORMADO]</text>

<!-- fork point -->
<circle cx="500" cy="330" r="4" fill="#333"/>
<line x1="500" y1="300" x2="500" y2="330" stroke="#555" stroke-width="2"/>

<line x1="500" y1="330" x2="165" y2="330" stroke="#555" stroke-width="2"/>
<line x1="500" y1="330" x2="500" y2="330" stroke="#555" stroke-width="2"/>
<line x1="500" y1="330" x2="835" y2="330" stroke="#555" stroke-width="2"/>

<line x1="165" y1="330" x2="165" y2="360" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="500" y1="330" x2="500" y2="360" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="835" y1="330" x2="835" y2="360" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<text x="500" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#868e96">se bifurca en 3 ramas independientes, en paralelo</text>

<!-- Rama 2.2 -->
<rect x="40" y="365" width="250" height="70" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="165" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">filter (2.2)</text>
<text x="165" y="406" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">evento == PURCHASE</text>
<text x="165" y="421" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">o ADD_CART</text>

<!-- Rama 2.4 -->
<rect x="375" y="365" width="250" height="70" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="500" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">keyBy(evento) (2.4)</text>
<text x="500" y="406" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">window(30s)</text>
<text x="500" y="421" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">+ sum</text>

<!-- Rama 2.5 -->
<rect x="710" y="365" width="250" height="70" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="835" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">keyBy(producto) (2.5)</text>
<text x="835" y="406" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">window(30s)</text>
<text x="835" y="421" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">+ sum</text>

<line x1="165" y1="435" x2="165" y2="465" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="500" y1="435" x2="500" y2="465" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="835" y1="435" x2="835" y2="465" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- salidas -->
<rect x="40" y="470" width="250" height="55" rx="10" fill="#fdf0da" stroke="#c9820a" stroke-width="2"/>
<text x="165" y="502" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a35a00">[2.2 FILTRADO]</text>

<rect x="375" y="470" width="250" height="55" rx="10" fill="#fdf0da" stroke="#c9820a" stroke-width="2"/>
<text x="500" y="502" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a35a00">[2.4 CONTEO 30s]</text>

<rect x="710" y="470" width="250" height="55" rx="10" fill="#fdf0da" stroke="#c9820a" stroke-width="2"/>
<text x="835" y="502" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a35a00">[2.5 PRODUCTO 30s]</text>

<!-- leyenda -->
<rect x="300" y="580" width="26" height="20" rx="5" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="334" y="595" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">Transformación (map/filter/keyBy/window)</text>

<rect x="300" y="610" width="26" height="20" rx="5" fill="#fdf0da" stroke="#c9820a" stroke-width="2"/>
<text x="334" y="625" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">Salida impresa en consola (print)</text>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
</marker>
</defs>
</svg>
