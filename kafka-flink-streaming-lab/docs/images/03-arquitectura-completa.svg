<svg viewBox="0 0 1100 760" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitectura completa: Kafka + Flink sobre AWS EC2</title>
<desc>Diagrama de arquitectura mostrando un VPC en AWS con un clúster de Kafka de 3 brokers en modo KRaft y una instancia cliente que corre el productor, el consumidor y el job de Flink, cuya salida se imprime en consola.</desc>
<rect x="0" y="0" width="1100" height="760" fill="#ffffff"/>

<text x="550" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">Arquitectura completa: de Kafka a Flink (AWS EC2)</text>

<!-- VPC outer box -->
<rect x="30" y="55" width="1040" height="560" rx="14" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="8,5"/>
<text x="50" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#495057">AWS · VPC 10.20.0.0/16 (us-east-1)</text>

<!-- Kafka cluster label -->
<text x="550" y="105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Cluster Kafka (KRaft) — topic ecommerce-events (3 particiones, factor 3)</text>

<!-- Broker 1 -->
<rect x="60" y="120" width="300" height="90" rx="10" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="2"/>
<text x="210" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">kafka-broker-1</text>
<text x="210" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">10.20.1.11 · node.id=1</text>
<text x="210" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">broker + controller</text>

<!-- Broker 2 -->
<rect x="400" y="120" width="300" height="90" rx="10" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="2"/>
<text x="550" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">kafka-broker-2</text>
<text x="550" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">10.20.1.12 · node.id=2</text>
<text x="550" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">broker + controller</text>

<!-- Broker 3 -->
<rect x="740" y="120" width="300" height="90" rx="10" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="2"/>
<text x="890" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">kafka-broker-3</text>
<text x="890" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">10.20.1.13 · node.id=3</text>
<text x="890" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">broker + controller</text>

<!-- kafka-client outer box -->
<rect x="60" y="290" width="980" height="290" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text x="80" y="315" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">kafka-client (10.20.1.20)</text>

<!-- producer.py -->
<rect x="90" y="335" width="270" height="90" rx="10" fill="#eafaf1" stroke="#2f9e44" stroke-width="2"/>
<text x="225" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">producer.py</text>
<text x="225" y="384" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">genera eventos e-commerce</text>
<text x="225" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">(VIEW/SEARCH/CART/PURCHASE)</text>

<!-- consumer.py -->
<rect x="405" y="335" width="270" height="90" rx="10" fill="#eafaf1" stroke="#2f9e44" stroke-width="2"/>
<text x="540" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">consumer.py</text>
<text x="540" y="384" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">consumer group demo</text>
<text x="540" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057">(C1 / C2, rebalanceo)</text>

<!-- Flink job -->
<rect x="720" y="335" width="290" height="220" rx="10" fill="#fff0f6" stroke="#c2255c" stroke-width="2"/>
<text x="865" y="362" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Flink Job (MiniCluster local)</text>
<text x="865" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#868e96">flink-lab07-ecommerce.jar</text>

<rect x="745" y="392" width="240" height="26" rx="6" fill="#ffffff" stroke="#c2255c" stroke-width="1.3"/>
<text x="865" y="409" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a">2.1 Parse + 2.3 Enriquecer</text>

<rect x="745" y="426" width="240" height="26" rx="6" fill="#ffffff" stroke="#c2255c" stroke-width="1.3"/>
<text x="865" y="443" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a">2.2 Filtrar PURCHASE/ADD_CART</text>

<rect x="745" y="460" width="240" height="26" rx="6" fill="#ffffff" stroke="#c2255c" stroke-width="1.3"/>
<text x="865" y="477" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a">2.4 Conteo por tipo (30s)</text>

<rect x="745" y="494" width="240" height="26" rx="6" fill="#ffffff" stroke="#c2255c" stroke-width="1.3"/>
<text x="865" y="511" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a">2.5 Agrupar por producto (30s)</text>

<text x="865" y="538" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#868e96">paralelismo local = 2 hilos</text>

<!-- Arrows: producer -> brokers -->
<path d="M225,335 L225,215" fill="none" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#arrowG)"/>
<text x="235" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f9e44">produce</text>

<!-- Arrows: brokers -> consumer -->
<path d="M540,215 L540,335" fill="none" stroke="#3b5bdb" stroke-width="2.2" marker-end="url(#arrowB)"/>
<text x="550" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3b5bdb">consume</text>

<!-- Arrows: brokers -> Flink -->
<path d="M865,215 L865,335" fill="none" stroke="#c2255c" stroke-width="2.2" marker-end="url(#arrowR)"/>
<text x="875" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#c2255c">consume (KafkaSource)</text>

<!-- Output console -->
<rect x="720" y="615" width="290" height="80" rx="10" fill="#fdf0da" stroke="#c9820a" stroke-width="2"/>
<text x="865" y="645" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a35a00">Consola (System.out)</text>
<text x="865" y="663" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#a35a00">[2.1] [2.2] [2.3] [2.4] [2.5]</text>
<text x="865" y="680" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#a35a00">— evidencia del informe —</text>

<path d="M865,580 L865,610" fill="none" stroke="#c2255c" stroke-width="2.2" marker-end="url(#arrowR)"/>

<defs>
<marker id="arrowG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2f9e44"/></marker>
<marker id="arrowB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#3b5bdb"/></marker>
<marker id="arrowR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#c2255c"/></marker>
</defs>

<!-- Leyenda -->
<rect x="60" y="720" width="22" height="16" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="90" y="733" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">Infraestructura Kafka (Pulumi/EC2)</text>

<rect x="350" y="720" width="22" height="16" fill="#eafaf1" stroke="#2f9e44" stroke-width="1.5"/>
<text x="380" y="733" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">Scripts Python</text>

<rect x="540" y="720" width="22" height="16" fill="#fff0f6" stroke="#c2255c" stroke-width="1.5"/>
<text x="570" y="733" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">Job Flink (Java/Maven)</text>

<rect x="750" y="720" width="22" height="16" fill="#fdf0da" stroke="#c9820a" stroke-width="1.5"/>
<text x="780" y="733" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">Salida / evidencia</text>
</svg>
