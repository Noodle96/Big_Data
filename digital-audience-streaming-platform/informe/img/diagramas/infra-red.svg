<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Topologia de red de la infraestructura (AWS Academy)</title>
  <desc>VPC 10.30.0.0/16 con una subred publica, un Security Group compartido y 8 instancias EC2 agrupadas por rol: brokers Kafka, cluster Flink y dashboard.</desc>

  <rect x="0" y="0" width="900" height="520" fill="#FFFFFF"/>

  <!-- VPC boundary -->
  <rect x="30" y="30" width="840" height="430" rx="10" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="45" y="55" fill="#374151" font-size="13" font-weight="700">VPC audiencias-lab-vpc (10.30.0.0/16)</text>

  <!-- Public subnet -->
  <rect x="50" y="70" width="800" height="360" rx="8" fill="#F5F7FA" stroke="#9CA3AF"/>
  <text x="65" y="92" fill="#4B5563" font-size="12" font-weight="700">Subred publica (10.30.1.0/24) -- Security Group compartido</text>

  <!-- Kafka group -->
  <rect x="75" y="110" width="230" height="150" rx="8" fill="#EAF2FB" stroke="#2E75B6"/>
  <text x="190" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Kafka (KRaft)</text>
  <text x="190" y="152" text-anchor="middle" font-size="11" fill="#374151">broker-1  10.30.1.11</text>
  <text x="190" y="170" text-anchor="middle" font-size="11" fill="#374151">broker-2  10.30.1.12</text>
  <text x="190" y="188" text-anchor="middle" font-size="11" fill="#374151">broker-3  10.30.1.13</text>
  <text x="190" y="212" text-anchor="middle" font-size="10" fill="#6B7280">9092 (broker) / 9093 (controller)</text>
  <text x="190" y="228" text-anchor="middle" font-size="10" fill="#6B7280">solo interno (VPC)</text>

  <!-- Flink group -->
  <rect x="335" y="110" width="230" height="220" rx="8" fill="#EAF2FB" stroke="#2E75B6"/>
  <text x="450" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Flink (cluster real)</text>
  <text x="450" y="152" text-anchor="middle" font-size="11" fill="#374151">jobmanager  10.30.1.21</text>
  <text x="450" y="170" text-anchor="middle" font-size="11" fill="#374151">taskmanager-1  10.30.1.22</text>
  <text x="450" y="188" text-anchor="middle" font-size="11" fill="#374151">taskmanager-2  10.30.1.23</text>
  <text x="450" y="206" text-anchor="middle" font-size="11" fill="#374151">taskmanager-3  10.30.1.24</text>
  <text x="450" y="230" text-anchor="middle" font-size="10" fill="#6B7280">6123 (RPC) -- solo interno</text>
  <text x="450" y="246" text-anchor="middle" font-size="10" fill="#1F5C96" font-weight="700">8081 (Web UI) -- expuesto a Internet</text>

  <!-- Dashboard group -->
  <rect x="595" y="110" width="230" height="150" rx="8" fill="#DCEAFB" stroke="#1F5C96"/>
  <text x="710" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Dashboard</text>
  <text x="710" y="152" text-anchor="middle" font-size="11" fill="#374151">dashboard  10.30.1.30</text>
  <text x="710" y="174" text-anchor="middle" font-size="10" fill="#6B7280">Postgres 5432 -- solo interno</text>
  <text x="710" y="190" text-anchor="middle" font-size="10" fill="#6B7280">TimescaleDB (extension)</text>
  <text x="710" y="212" text-anchor="middle" font-size="10" fill="#1F5C96" font-weight="700">Grafana 3000 -- expuesto a Internet</text>

  <!-- Security group box -->
  <rect x="75" y="360" width="750" height="55" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-dasharray="3,3"/>
  <text x="90" y="378" font-size="11" fill="#374151" font-weight="700">Security Group audiencias-lab-security-group:</text>
  <text x="90" y="396" font-size="10" fill="#4B5563">ingress 22 (SSH), 8081 (Flink UI), 3000 (Grafana) desde 0.0.0.0/0  |  todo el trafico interno permitido entre miembros del SG  |  egress abierto</text>

  <text x="450" y="450" text-anchor="middle" fill="#6B7280" font-size="12">8 instancias EC2 t3.small, misma VPC/subred/Security Group -- IPs privadas estaticas via Pulumi</text>

  <text x="450" y="495" text-anchor="middle" fill="#111827" font-size="13" font-weight="700">Internet</text>
  <line x1="450" y1="30" x2="450" y2="475" stroke="#9CA3AF" stroke-width="0" />
</svg>
