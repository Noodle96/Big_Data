<svg viewBox="0 0 920 1080" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Detalle interno del job AudienciasDigitalesJob</title>
  <desc>Agentes -> Productores -> Kafka (2 topics, 3 particiones c/u) -> Cluster Flink (JobManager + 3 TaskManagers, 4 ramas de procesamiento) -> 8 tablas de PostgreSQL/TimescaleDB -> Dashboard.</desc>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E75B6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="1080" fill="#FFFFFF"/>

  <!-- ================= FILA 1: agentes + productores ================= -->
  <rect x="20" y="20" width="230" height="230" rx="10" fill="#EAF2FB" stroke="#2E75B6"/>
  <text x="135" y="42" text-anchor="middle" fill="#111827" font-size="13" font-weight="700">8 perfiles de agente</text>
  <text x="35" y="64" font-size="11" fill="#374151">1. Comprador compulsivo</text>
  <text x="35" y="82" font-size="11" fill="#374151">2. Comparador</text>
  <text x="35" y="100" font-size="11" fill="#374151">3. Nocturno</text>
  <text x="35" y="118" font-size="11" fill="#374151">4. Premium</text>
  <text x="35" y="136" font-size="11" fill="#374151">5. Frecuente</text>
  <text x="35" y="154" font-size="11" fill="#374151">6. Explorador</text>
  <text x="35" y="172" font-size="11" fill="#374151">7. Indeciso</text>
  <text x="35" y="190" font-size="11" fill="#374151">8. Estacional</text>
  <text x="135" y="222" text-anchor="middle" font-size="11" fill="#6B7280">JSON por evento</text>

  <line x1="250" y1="135" x2="300" y2="135" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="305" y="60" width="180" height="150" rx="10" fill="#FDEBD3" stroke="#C77B1E"/>
  <text x="395" y="85" text-anchor="middle" fill="#111827" font-size="13" font-weight="700">Producers</text>
  <text x="320" y="108" font-size="11" fill="#374151">- WebProducer</text>
  <text x="320" y="126" font-size="11" fill="#374151">- MobileProducer</text>
  <text x="320" y="144" font-size="11" fill="#374151">- IoTProducer</text>
  <text x="320" y="162" font-size="11" fill="#374151">- VehicleProducer</text>
  <text x="320" y="180" font-size="11" fill="#374151">- POSProducer</text>

  <line x1="485" y1="135" x2="530" y2="135" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ================= KAFKA: 2 topics x 3 particiones ================= -->
  <rect x="535" y="20" width="365" height="230" rx="10" fill="#EAF2FB" stroke="#2E75B6"/>
  <text x="717" y="42" text-anchor="middle" fill="#111827" font-size="14" font-weight="700">Apache Kafka</text>

  <rect x="552" y="55" width="330" height="80" rx="6" fill="#FFFFFF" stroke="#2E75B6"/>
  <text x="717" y="72" text-anchor="middle" fill="#111827" font-size="12" font-weight="700">Topic: user-events</text>
  <rect x="562" y="80" width="95" height="40" rx="4" fill="#EAF2FB" stroke="#2E75B6"/>
  <text x="609" y="104" text-anchor="middle" font-size="10" fill="#374151">Partition 1</text>
  <rect x="667" y="80" width="95" height="40" rx="4" fill="#EAF2FB" stroke="#2E75B6"/>
  <text x="714" y="104" text-anchor="middle" font-size="10" fill="#374151">Partition 2</text>
  <rect x="772" y="80" width="95" height="40" rx="4" fill="#EAF2FB" stroke="#2E75B6"/>
  <text x="819" y="104" text-anchor="middle" font-size="10" fill="#374151">Partition 3</text>

  <rect x="552" y="150" width="330" height="80" rx="6" fill="#FFFFFF" stroke="#2E75B6"/>
  <text x="717" y="167" text-anchor="middle" fill="#111827" font-size="12" font-weight="700">Topic: purchase-events</text>
  <rect x="562" y="175" width="95" height="40" rx="4" fill="#EAF2FB" stroke="#2E75B6"/>
  <text x="609" y="199" text-anchor="middle" font-size="10" fill="#374151">Partition 1</text>
  <rect x="667" y="175" width="95" height="40" rx="4" fill="#EAF2FB" stroke="#2E75B6"/>
  <text x="714" y="199" text-anchor="middle" font-size="10" fill="#374151">Partition 2</text>
  <rect x="772" y="175" width="95" height="40" rx="4" fill="#EAF2FB" stroke="#2E75B6"/>
  <text x="819" y="199" text-anchor="middle" font-size="10" fill="#374151">Partition 3</text>

  <text x="717" y="270" text-anchor="middle" font-size="11" fill="#6B7280">replica 3, distribuido en kafka-broker-1/2/3</text>

  <line x1="717" y1="280" x2="717" y2="330" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ================= CLUSTER FLINK ================= -->
  <rect x="120" y="335" width="700" height="330" rx="10" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="470" y="360" text-anchor="middle" fill="#111827" font-size="15" font-weight="700">Cluster Flink</text>

  <rect x="150" y="380" width="220" height="90" rx="8" fill="#E8F0DE" stroke="#5B8C3E"/>
  <text x="260" y="402" text-anchor="middle" fill="#111827" font-size="12" font-weight="700">JobManager</text>
  <text x="260" y="422" text-anchor="middle" fill="#374151" font-size="11">AudienciasDigitalesJob.java</text>
  <text x="260" y="440" text-anchor="middle" fill="#374151" font-size="11">(Flink Job)</text>
  <text x="260" y="458" text-anchor="middle" fill="#6B7280" font-size="10">TaskManager 1, 2, 3</text>

  <line x1="370" y1="425" x2="410" y2="425" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="415" y="380" width="380" height="270" rx="8" fill="#EAF2FB" stroke="#2E75B6"/>
  <text x="605" y="402" text-anchor="middle" fill="#111827" font-size="12" font-weight="700">4 ramas de procesamiento</text>
  <text x="430" y="426" font-size="11" fill="#374151">1. Filter (limpieza/validacion)</text>
  <text x="430" y="448" font-size="11" fill="#374151">2. windowAll() + WindowSummaryFunction</text>
  <text x="430" y="470" font-size="11" fill="#374151">   (agregacion por ventana, 10s)</text>
  <text x="430" y="494" font-size="11" fill="#374151">3. keyBy(user_id) + ClassifyAudienceFunction</text>
  <text x="430" y="516" font-size="11" fill="#374151">   (audiencias + alertas)</text>
  <text x="430" y="540" font-size="11" fill="#374151">4. window join (VIEW_PRODUCT x PURCHASE)</text>
  <text x="430" y="562" font-size="11" fill="#374151">   + ViewPurchaseJoinFunction</text>
  <text x="605" y="600" text-anchor="middle" fill="#6B7280" font-size="10">Sink JDBC (flink-connector-jdbc-postgres)</text>
  <text x="605" y="618" text-anchor="middle" fill="#6B7280" font-size="10">en vez de sinks a topicos Kafka</text>

  <line x1="470" y1="665" x2="470" y2="710" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ================= 8 TABLAS POSTGRES ================= -->
  <rect x="60" y="715" width="800" height="180" rx="10" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="120" y="705" fill="#111827" font-size="13" font-weight="700">PostgreSQL / TimescaleDB (Sink)</text>

  <g font-size="10.5" fill="#111827">
    <rect x="80" y="740" width="170" height="45" rx="6" fill="#FBEAEA" stroke="#B23A48"/>
    <text x="165" y="767" text-anchor="middle">eventos_por_tipo</text>

    <rect x="270" y="740" width="170" height="45" rx="6" fill="#FBEAEA" stroke="#B23A48"/>
    <text x="355" y="767" text-anchor="middle">resumen_ventana</text>

    <rect x="460" y="740" width="170" height="45" rx="6" fill="#FBEAEA" stroke="#B23A48"/>
    <text x="545" y="767" text-anchor="middle">productos_vistos</text>

    <rect x="650" y="740" width="170" height="45" rx="6" fill="#FBEAEA" stroke="#B23A48"/>
    <text x="735" y="767" text-anchor="middle">productos_comprados</text>

    <rect x="80" y="800" width="170" height="45" rx="6" fill="#FBEAEA" stroke="#B23A48"/>
    <text x="165" y="827" text-anchor="middle">compras_por_region</text>

    <rect x="270" y="800" width="170" height="45" rx="6" fill="#FBEAEA" stroke="#B23A48"/>
    <text x="355" y="827" text-anchor="middle">audiencias</text>

    <rect x="460" y="800" width="170" height="45" rx="6" fill="#FBEAEA" stroke="#B23A48"/>
    <text x="545" y="827" text-anchor="middle">alertas</text>

    <rect x="650" y="800" width="170" height="45" rx="6" fill="#FBEAEA" stroke="#B23A48"/>
    <text x="735" y="827" text-anchor="middle">productos_relacionados</text>
  </g>
  <text x="470" y="882" text-anchor="middle" font-size="10" fill="#6B7280">Instancia "dashboard" (PostgreSQL 16 + TimescaleDB)</text>

  <line x1="470" y1="895" x2="470" y2="940" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ================= DASHBOARD ================= -->
  <rect x="330" y="945" width="280" height="90" rx="10" fill="#EAF2FB" stroke="#2E75B6"/>
  <text x="470" y="975" text-anchor="middle" fill="#111827" font-size="13" font-weight="700">Grafana</text>
  <text x="470" y="998" text-anchor="middle" fill="#374151" font-size="11">Dashboard con 10 paneles</text>
  <text x="470" y="1016" text-anchor="middle" fill="#374151" font-size="11">(instancia "dashboard")</text>
</svg>
