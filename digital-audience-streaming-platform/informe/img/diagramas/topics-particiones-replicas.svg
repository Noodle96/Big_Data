<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Distribucion de particiones y replicas de los topics en el cluster Kafka</title>
  <desc>Cada uno de los 3 brokers es lider de 2 particiones (una por topic) y replica de las otras 4, con las 6 particiones totalmente replicadas (ISR completo).</desc>

  <rect x="0" y="0" width="900" height="520" fill="#FFFFFF"/>

  <text x="450" y="30" text-anchor="middle" fill="#111827" font-size="15" font-weight="700">Cluster Kafka: 3 brokers, 2 topics x 3 particiones, factor de replicacion 3</text>

  <!-- Broker 1 -->
  <g>
    <rect x="40" y="60" width="260" height="400" rx="10" fill="#F5F7FA" stroke="#374151" stroke-width="1.5"/>
    <text x="170" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">kafka-broker-1</text>
    <text x="170" y="108" text-anchor="middle" font-size="10" fill="#6B7280">10.30.1.11 -- nodeId 1</text>

    <rect x="60" y="125" width="220" height="130" rx="8" fill="#2E75B6"/>
    <text x="170" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Lider de</text>
    <text x="170" y="172" text-anchor="middle" font-size="11" fill="#FFFFFF">user-events -- Particion 1</text>
    <text x="170" y="192" text-anchor="middle" font-size="11" fill="#FFFFFF">purchase-events -- Particion 1</text>
    <text x="170" y="218" text-anchor="middle" font-size="9" fill="#DCEAFB">Replicas: broker-2, broker-3</text>
    <text x="170" y="236" text-anchor="middle" font-size="9" fill="#DCEAFB">ISR completo (1,2,3)</text>

    <rect x="60" y="270" width="220" height="170" rx="8" fill="#EAF2FB" stroke="#2E75B6"/>
    <text x="170" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Replica de</text>
    <text x="170" y="317" text-anchor="middle" font-size="11" fill="#374151">user-events -- Particion 0</text>
    <text x="170" y="335" text-anchor="middle" font-size="11" fill="#374151">user-events -- Particion 2</text>
    <text x="170" y="359" text-anchor="middle" font-size="11" fill="#374151">purchase-events -- Particion 0</text>
    <text x="170" y="377" text-anchor="middle" font-size="11" fill="#374151">purchase-events -- Particion 2</text>
    <text x="170" y="405" text-anchor="middle" font-size="9" fill="#6B7280">Lideres: broker-3, broker-2</text>
  </g>

  <!-- Broker 2 -->
  <g>
    <rect x="320" y="60" width="260" height="400" rx="10" fill="#F5F7FA" stroke="#374151" stroke-width="1.5"/>
    <text x="450" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">kafka-broker-2</text>
    <text x="450" y="108" text-anchor="middle" font-size="10" fill="#6B7280">10.30.1.12 -- nodeId 2</text>

    <rect x="340" y="125" width="220" height="130" rx="8" fill="#2E75B6"/>
    <text x="450" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Lider de</text>
    <text x="450" y="172" text-anchor="middle" font-size="11" fill="#FFFFFF">user-events -- Particion 2</text>
    <text x="450" y="192" text-anchor="middle" font-size="11" fill="#FFFFFF">purchase-events -- Particion 2</text>
    <text x="450" y="218" text-anchor="middle" font-size="9" fill="#DCEAFB">Replicas: broker-3, broker-1</text>
    <text x="450" y="236" text-anchor="middle" font-size="9" fill="#DCEAFB">ISR completo (2,3,1)</text>

    <rect x="340" y="270" width="220" height="170" rx="8" fill="#EAF2FB" stroke="#2E75B6"/>
    <text x="450" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Replica de</text>
    <text x="450" y="317" text-anchor="middle" font-size="11" fill="#374151">user-events -- Particion 0</text>
    <text x="450" y="335" text-anchor="middle" font-size="11" fill="#374151">user-events -- Particion 1</text>
    <text x="450" y="359" text-anchor="middle" font-size="11" fill="#374151">purchase-events -- Particion 0</text>
    <text x="450" y="377" text-anchor="middle" font-size="11" fill="#374151">purchase-events -- Particion 1</text>
    <text x="450" y="405" text-anchor="middle" font-size="9" fill="#6B7280">Lideres: broker-3, broker-1</text>
  </g>

  <!-- Broker 3 -->
  <g>
    <rect x="600" y="60" width="260" height="400" rx="10" fill="#F5F7FA" stroke="#374151" stroke-width="1.5"/>
    <text x="730" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">kafka-broker-3</text>
    <text x="730" y="108" text-anchor="middle" font-size="10" fill="#6B7280">10.30.1.13 -- nodeId 3</text>

    <rect x="620" y="125" width="220" height="130" rx="8" fill="#2E75B6"/>
    <text x="730" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Lider de</text>
    <text x="730" y="172" text-anchor="middle" font-size="11" fill="#FFFFFF">user-events -- Particion 0</text>
    <text x="730" y="192" text-anchor="middle" font-size="11" fill="#FFFFFF">purchase-events -- Particion 0</text>
    <text x="730" y="218" text-anchor="middle" font-size="9" fill="#DCEAFB">Replicas: broker-1, broker-2</text>
    <text x="730" y="236" text-anchor="middle" font-size="9" fill="#DCEAFB">ISR completo (3,1,2)</text>

    <rect x="620" y="270" width="220" height="170" rx="8" fill="#EAF2FB" stroke="#2E75B6"/>
    <text x="730" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Replica de</text>
    <text x="730" y="317" text-anchor="middle" font-size="11" fill="#374151">user-events -- Particion 1</text>
    <text x="730" y="335" text-anchor="middle" font-size="11" fill="#374151">user-events -- Particion 2</text>
    <text x="730" y="359" text-anchor="middle" font-size="11" fill="#374151">purchase-events -- Particion 1</text>
    <text x="730" y="377" text-anchor="middle" font-size="11" fill="#374151">purchase-events -- Particion 2</text>
    <text x="730" y="405" text-anchor="middle" font-size="9" fill="#6B7280">Lideres: broker-1, broker-2</text>
  </g>

  <text x="450" y="480" text-anchor="middle" fill="#6B7280" font-size="11">Cada broker es lider de 2 particiones (una por topic) y replica de las otras 4 -- distribucion balanceada</text>
  <text x="450" y="498" text-anchor="middle" fill="#6B7280" font-size="11">Las 6 particiones tienen su ISR (In-Sync Replicas) completo: ninguna esta sub-replicada</text>
</svg>
