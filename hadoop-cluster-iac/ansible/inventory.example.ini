[master]
hadoop-master ansible_host=<MASTER_PUBLIC_IP> ansible_private_ip=<MASTER_PRIVATE_IP>

[workers]
hadoop-worker-1 ansible_host=<WORKER_1_PRIVATE_IP>
hadoop-worker-2 ansible_host=<WORKER_2_PRIVATE_IP>
hadoop-worker-3 ansible_host=<WORKER_3_PRIVATE_IP>

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=../keys/hadoop-cluster-key.pem

[workers:vars]
ansible_ssh_common_args='-o ProxyCommand="ssh -i ../keys/hadoop-cluster-key.pem -W %h:%p ubuntu@<MASTER_PUBLIC_IP>" -o StrictHostKeyChecking=no'